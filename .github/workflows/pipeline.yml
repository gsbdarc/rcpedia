name: DeployStanford

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the workflow on'
        required: true
        default: 'main'
  push:
    branches:
      - main
      - QA

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Needed so GITHUB_TOKEN can force-push the built site to the deploy-* branch.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.3'

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Replace placeholders in docs/assets/vars.json
        env: 
          TOTAL_PHYSICAL_CORES: ${{ vars.TOTAL_PHYSICAL_CORES }}
          TOTAL_MEMORY_TB: ${{ vars.TOTAL_MEMORY_TB }}
          TOTAL_GPUS: ${{ vars.TOTAL_GPUS }}
          TOTAL_STORAGE_TB: ${{ vars.TOTAL_STORAGE_TB }}
          TOTAL_NODE_COUNT: ${{ vars.TOTAL_NODE_COUNT }}
          SLURM_NODE_COUNT: ${{ vars.SLURM_NODE_COUNT }}
        run: |
          sed -i "s/TOTAL_PHYSICAL_CORES_PLACEHOLDER/$TOTAL_PHYSICAL_CORES/g" docs/assets/vars.json
          sed -i "s/TOTAL_MEMORY_TB_PLACEHOLDER/$TOTAL_MEMORY_TB/g" docs/assets/vars.json
          sed -i "s/TOTAL_GPUS_PLACEHOLDER/$TOTAL_GPUS/g" docs/assets/vars.json
          sed -i "s/TOTAL_STORAGE_TB_PLACEHOLDER/$TOTAL_STORAGE_TB/g" docs/assets/vars.json
          sed -i "s/TOTAL_NODE_COUNT_PLACEHOLDER/$TOTAL_NODE_COUNT/g" docs/assets/vars.json
          sed -i "s/SLURM_NODE_COUNT_PLACEHOLDER/$SLURM_NODE_COUNT/g" docs/assets/vars.json

      - name: Debug placeholder replacement
        run: |
          echo "docs/assets/vars.json after placeholder replacement:"
          cat docs/assets/vars.json

      - name: Remove analytics for QA build
        if: github.ref == 'refs/heads/QA'
        run: |
          sed -i 's/^extra:$/extra: {}/; /^  analytics:/d; /^    provider: google/d; /^    property: /d' mkdocs.yml
          echo "mkdocs.yml after removing analytics:"
          grep -A3 "^extra" mkdocs.yml || true

      # A page listed in mkdocs.yml but renamed on disk only produces a plugin WARNING
      # (the build still succeeds, the page just vanishes from /llms.txt); a page added on
      # disk but never listed produces no message at all. Both fail the build here, so
      # /llms.txt cannot silently drift out of sync with docs/.
      - name: Check llms.txt sections match docs/
        run: |
          python - <<'EOF'
          import pathlib, re, sys

          # docs/index.md is a template shell (template: home.html) with no prose to serve.
          EXCLUDE = {"docs/index.md"}

          config = pathlib.Path("mkdocs.yml").read_text()
          block = config.split("      sections:", 1)[1]
          block = re.split(r"^[a-z_]", block, maxsplit=1, flags=re.M)[0]
          listed = {"docs/" + p for p in re.findall(r"^          - ([^:\s]+\.md)", block, flags=re.M)}
          on_disk = {p.as_posix() for p in pathlib.Path("docs").rglob("*.md")} - EXCLUDE

          unlisted = sorted(on_disk - listed)
          missing = sorted(listed - on_disk)
          if unlisted:
              print("Not listed under plugins.llmstxt.sections in mkdocs.yml, so invisible")
              print("to AI agents reading /llms.txt - add each with a one-line description:")
              print("".join("  " + p + "\n" for p in unlisted), end="")
          if missing:
              print("Listed under plugins.llmstxt.sections in mkdocs.yml but not on disk -")
              print("renamed or deleted? Update or drop the entry:")
              print("".join("  " + p + "\n" for p in missing), end="")
          if unlisted or missing:
              sys.exit(1)
          print(f"ok: all {len(on_disk)} pages are listed")
          EOF

      - name: Build MkDocs site
        run: mkdocs build --clean

      # Lets the DeployMonitor workflow tell from outside whether the published site is
      # current. Nothing on the web host reports its own health, and a stalled pull-based
      # deploy is silent, so this is the only signal that the live site has gone stale.
      - name: Write build-info.json
        run: |
          cat > site/build-info.json <<EOF
          {
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "run_id": "${{ github.run_id }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "built_at_epoch": $(date -u +%s)
          }
          EOF
          cat site/build-info.json

      # Served from the docroot by Apache. Written by the build because the deploy
      # rsyncs with --delete-after, so a hand-placed file on the server gets removed.
      # Every directive below was verified against the live dev host before landing;
      # the IfModule guards mean a missing module skips rather than 500s the site.
      - name: Write .htaccess
        run: |
          cat > site/.htaccess <<'EOF'
          # The llms.txt plugin emits a Markdown twin beside every listed page. Without
          # this they are served with no Content-Type at all.
          AddType text/markdown .md

          # Without this the host serves Apache's own bare 404 -- unbranded, no
          # navigation, no search. overrides/404.html is the real page; Material does
          # not copy dotfiles from custom_dir, which is why overrides/.htaccess never
          # took effect and this has to be set here.
          ErrorDocument 404 /404.html

          <IfModule mod_rewrite.c>
            RewriteEngine On

            # Serve the Markdown twin to known AI agents, at the same URL. Same content,
            # ~6x smaller, and no navigation chrome. The -f test means pages without a
            # twin (blog archive and category pages) fall through to HTML untouched, and
            # search engine crawlers are deliberately absent from this list so indexed
            # content always matches what a browser sees.
            RewriteCond %{HTTP_USER_AGENT} (ClaudeBot|Claude-User|Claude-SearchBot|GPTBot|ChatGPT-User|OAI-SearchBot|PerplexityBot|Perplexity-User|CCBot|meta-externalagent|Bytespider) [NC]
            RewriteCond %{REQUEST_FILENAME}/index.md -f
            RewriteRule ^(.*)$ /$1/index.md [L]

            # Flag pages that have a twin, for the Link header below.
            RewriteCond %{REQUEST_FILENAME}/index.md -f
            RewriteRule ^ - [E=HAS_MD:1]
          </IfModule>

          <IfModule mod_headers.c>
            # Advertise the Markdown twin to anything that reads response headers,
            # regardless of user-agent. This is what covers the agents that do not
            # identify themselves -- a Claude Code session arrives as a generic client.
            Header set Link "<index.md>; rel=\"alternate\"; type=\"text/markdown\"" env=HAS_MD

            # Point every page at the site map for LLMs. Appended so it does not clobber
            # the per-page Link above.
            Header append Link "</llms.txt>; rel=\"alternate\"; type=\"text/plain\"; title=\"llms.txt\""

            # Required: responses now differ by user-agent.
            Header append Vary User-Agent
          </IfModule>
          EOF
          echo "--- site/.htaccess ---"
          cat site/.htaccess

      - name: Generate robots.txt
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/QA" ]]; then
            echo -e "User-agent: *\nDisallow: /" > site/robots.txt
          else
            echo -e "User-agent: *\nAllow: /" > site/robots.txt
          fi

      # Publish the built site to a per-environment deploy branch. A cPanel cron job on
      # the Stanford host pulls this branch over HTTPS and rsyncs it into the docroot,
      # replacing the old inbound SSH/rsync deploy that the firewall now blocks.
      - name: Publish built site to deploy branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.ref }}" = "refs/heads/QA" ]; then
            B=deploy-qa
          else
            B=deploy-main
          fi
          ghp-import -n -f -p -b "$B" -m "deploy ${{ github.sha }}" site
